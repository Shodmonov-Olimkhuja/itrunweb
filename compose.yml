services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_LABEL_SERVICE}.rule=Host(`$DOMAIN_URL`)"
      - "traefik.http.routers.${TRAEFIK_LABEL_SERVICE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_LABEL_SERVICE}.entrypoints=web,websecure,relay"
      - "traefik.http.services.${TRAEFIK_LABEL_SERVICE}.loadbalancer.server.port=80"
    restart: unless-stopped


networks:
  traefik:
    external: true
